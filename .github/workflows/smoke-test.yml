name: Production smoke test

# Runs scripts/smoke-test.mjs against production:
#   - automatically when a GitHub deployment reports success (Railway)
#   - manually after a release to spot regressions

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test. Defaults to production.'
        required: true
        default: 'https://barodarisingstar.com'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run smoke test
        env:
          BASE_URL: ${{ inputs.base_url || vars.PRODUCTION_URL || 'https://barodarisingstar.com' }}
        run: node scripts/smoke-test.mjs
