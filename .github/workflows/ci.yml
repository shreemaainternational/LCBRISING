name: CI

# Railway deploys main only after every check suite on the commit passes
# ("Wait for CI"), so this workflow is the production gate:
#   PR:           lint → typecheck → build → migration checks
#   push to main: same checks → apply pending Supabase migrations
# A failed migration fails this run, which blocks the Railway deploy.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: it may be mid-way through a production migration.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Migration checks
        env:
          ALLOW_DESTRUCTIVE: ${{ contains(github.event.pull_request.labels.*.name, 'migration:destructive-approved') && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/migrations.mjs check --base "origin/${{ github.base_ref }}"
          else
            node scripts/migrations.mjs check
          fi
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply pending migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Unknown "before" (first push, force-push) counts as "changed" so
          # we fail closed rather than silently skipping a migration.
          changed="unknown"
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD -- supabase/migrations)
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            if [ -n "$changed" ]; then
              echo "::error::This push changes migrations but SUPABASE_ACCESS_TOKEN is not set, so they cannot be applied. Blocking deploy."
              echo "$changed"
              exit 1
            fi
            echo "::warning::SUPABASE_ACCESS_TOKEN not set; no migration changes in this push, skipping."
            exit 0
          fi

          if [ -n "$changed" ]; then
            node scripts/migrations.mjs apply
          else
            node scripts/migrations.mjs apply --if-baselined
          fi
